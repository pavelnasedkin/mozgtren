<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1f2e">
  <meta name="description" content="Короткие игры для тренировки памяти, внимания и счёта">
  <title>МозгТрен</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <h1 class="logo">МозгТрен</h1>
      <p class="tagline">5–10 минут в день</p>
    </header>

    <section id="screen-home" class="screen screen--active">
      <div class="stats" id="stats-panel" aria-live="polite"></div>
      <button type="button" class="btn btn--primary btn--large" id="btn-daily">
        Ежедневная тренировка
      </button>
      <p class="hint">3 мини-игры подряд · ~5 мин</p>
      <h2 class="section-title">Отдельные игры</h2>
      <ul class="game-list" id="game-list"></ul>
      <footer class="site-footer">
        <button type="button" class="btn btn--ghost btn--reset" id="btn-reset-site">
          Сбросить настройки сайта
        </button>
      </footer>
    </section>

    <section id="screen-game" class="screen" hidden>
      <div class="game-top">
        <button type="button" class="btn btn--ghost btn--back" id="btn-back" aria-label="Назад">←</button>
        <div class="game-meta">
          <h2 class="game-title" id="game-title"></h2>
          <p class="game-progress" id="game-progress"></p>
        </div>
        <div class="timer" id="game-timer" aria-hidden="true"></div>
      </div>
      <div class="game-area" id="game-area"></div>
      <p class="game-hint" id="game-hint"></p>
      <div id="game-settings" class="game-settings" hidden></div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <h2 class="result-title" id="result-title">Готово!</h2>
      <p class="result-score" id="result-score"></p>
      <p class="result-detail" id="result-detail"></p>
      <div class="result-actions">
        <button type="button" class="btn btn--primary" id="btn-next">Далее</button>
        <button type="button" class="btn btn--secondary" id="btn-replay">Еще раз</button>
        <button type="button" class="btn btn--secondary" id="btn-home">На главную</button>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/stroop.js"></script>
  <script src="js/games/math.js"></script>
  <script src="js/games/simon.js"></script>
  <script src="js/games/nback.js"></script>
  <script src="js/games/reaction.js"></script>
  <script src="js/games/anagram.js"></script>
  <script src="js/games/puzzle15.js"></script>
  <script src="js/games/oddone.js"></script>
  <script src="js/games/sequence.js"></script>
  <script src="js/games/compare.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
